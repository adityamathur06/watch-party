<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Party</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <main class="landing">
    <h1 class="app-title">Watch Party</h1>
    <p class="tagline">
      Watch movies together. Talk in real time.
    </p>

    <div class="auth-buttons">
      <button id="open-login" class="btn primary">Login</button>
      <button id="open-signup" class="btn secondary">Sign Up</button>
    </div>
  </main>

  <div id="overlay" class="overlay">

    <div class="modal hidden" id="login-modal">
      <button class="close-btn">&times;</button>
      <h2>Login</h2>

      <form>
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit" class="btn primary">Login</button>
      </form>
    </div>

    <div class="modal hidden" id="signup-modal">
      <button class="close-btn">&times;</button>
      <h2>Sign Up</h2>

      <form>
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Create Password" required />
        <button type="submit" class="btn primary">Continue</button>
      </form>
    </div>

    <div class="modal hidden" id="create-account-modal">
      <h2>Create Your Account</h2>

      <form>
        <input type="text" placeholder="Your Name" required />
        <button type="submit" class="btn primary">Finish</button>
      </form>
    </div>

  </div>


  <script type="module" src="js/main.js"></script>
</body>
</html>
