<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Watch Party – Room</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/room.css" />
</head>

<body class="room-body">
    <div class="room-page">
        <header class="room-header">
            <div class="room-header-left">
                <button id="toggleMembers" class="toggle-btn">☰</button>
                <h1>Room</h1>
            </div>

            <button id="leaveRoomBtn" class="leave-room-btn">Leave Room</button>

        </header>

        <main class="room-layout">

            <aside class="members-panel">
                <h2 class="members-title">Members</h2>
                <ul id="members-list"></ul>
            </aside>


            <div class="video-area">
                <video id="roomVideo" controls preload="metadata"></video>
            </div>


            <aside class="chat-panel">
                <div class="chat-messages" id="chatMessages"></div>

                <form class="chat-input" id="chatForm">
                    <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off" required />
                    <button type="submit">Send</button>
                </form>
            </aside>


        </main>

    </div>


    <script type="module" src="js/room.js"></script>
</body>

</html>
